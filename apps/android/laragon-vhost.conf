# Copy to C:/laragon/etc/apache2/sites-enabled/homelib-lan.conf
# then restart Apache. Lets phones and TVs open Homelib by the PC LAN IP.

<VirtualHost *:80>
    DocumentRoot "C:/laragon/www/homelib/public"
    ServerName homelib.lan
    ServerAlias localhost 127.0.0.1 192.168.* 10.* 172.16.* 172.17.* 172.18.* 172.19.* 172.20.* 172.21.* 172.22.* 172.23.* 172.24.* 172.25.* 172.26.* 172.27.* 172.28.* 172.29.* 172.30.* 172.31.*
    <Directory "C:/laragon/www/homelib/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
